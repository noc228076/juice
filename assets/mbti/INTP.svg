<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgINTP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4ECF8"/>
      <stop offset="100%" stop-color="#E5D2F0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="94" fill="url(#bgINTP)" stroke="#88619A" stroke-width="3"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#88619A" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
  
  <!-- Logician: Lab Coat, Flask with Green/Cyan Chemical & Messy Hair -->
  <!-- Body: Lab Coat -->
  <path d="M54,168 C54,126 72,118 100,118 C128,118 146,126 146,168 Z" fill="#FFFFFF" stroke="#D1BDDF" stroke-width="2"/>
  <!-- Inner shirt: Purple sweater -->
  <path d="M86,118 L100,140 L114,118 Z" fill="#88619A"/>
  <!-- Head -->
  <circle cx="100" cy="78" r="27" fill="#FDEDE0"/>
  <!-- Messy wild scientist hair -->
  <path d="M68,76 C65,50 78,38 98,38 C116,38 132,48 132,74 C136,66 128,52 114,50 C108,44 88,44 82,54 C74,58 68,66 68,76 Z" fill="#4A295B"/>
  <path d="M125,48 C135,42 142,52 136,62" stroke="#4A295B" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Glasses: Round scientist wire frames -->
  <circle cx="87" cy="78" r="9" fill="none" stroke="#3D204E" stroke-width="2"/>
  <circle cx="113" cy="78" r="9" fill="none" stroke="#3D204E" stroke-width="2"/>
  <line x1="96" y1="78" x2="104" y2="78" stroke="#3D204E" stroke-width="2"/>
  <circle cx="87" cy="78" r="2.5" fill="#3D204E"/>
  <circle cx="113" cy="78" r="2.5" fill="#3D204E"/>
  <!-- Puzzled thoughtful mouth -->
  <line x1="96" y1="94" x2="104" y2="94" stroke="#A86A55" stroke-width="2" stroke-linecap="round"/>
  <!-- Prop: Chemical Flask with bubbling liquid -->
  <g transform="translate(120, 122)">
    <path d="M12,4 L18,4 L18,14 L28,32 C30,35 27,38 23,38 L7,38 C3,38 0,35 2,32 L12,14 Z" fill="#20C997" opacity="0.85" filter="url(#glow)"/>
    <path d="M12,4 L18,4 L18,14 L28,32 C30,35 27,38 23,38 L7,38 C3,38 0,35 2,32 L12,14 Z" fill="none" stroke="#3D204E" stroke-width="2"/>
    <!-- Bubbles -->
    <circle cx="14" cy="24" r="2" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="18" cy="28" r="1.5" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="15" cy="33" r="2" fill="#FFFFFF" opacity="0.8"/>
    <!-- Vapor -->
    <path d="M15,2 Q17,-4 13,-8" stroke="#20C997" stroke-width="2" fill="none" opacity="0.7" stroke-linecap="round"/>
  </g>
</svg>