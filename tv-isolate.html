<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>解码环境 vs 源 对照测试</title>
<style>
  body { background:#0b0c10; color:#f2eee3; font-family:-apple-system,"Segoe UI",sans-serif; padding:16px; margin:0; }
  h1 { font-size:17px; margin:0 0 4px; }
  .sub { font-size:12px; opacity:.55; margin-bottom:14px; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .tabs button { padding:8px 16px; border-radius:8px; border:1px solid rgba(255,255,255,.16);
                 background:rgba(255,255,255,.06); color:#f2eee3; font-size:13px; cursor:pointer; }
  .tabs button.on { background:#2f80ed; border-color:#2f80ed; color:#fff; }
  #wrap { position:relative; width:100%; max-width:860px; aspect-ratio:16/9; background:#000; border-radius:10px; overflow:hidden; }
  video { width:100%; height:100%; display:block; background:#000; }
  #verdict { position:absolute; left:10px; top:10px; padding:6px 14px; border-radius:8px;
             font-size:13px; font-family:ui-monospace,monospace; background:rgba(0,0,0,.75);
             border:1px solid rgba(255,255,255,.15); }
  #verdict.ok { color:#69db7c; border-color:#2f9e44; }
  #verdict.bad { color:#ff8787; border-color:#c92a2a; }
  #verdict.warn { color:#ffd43b; border-color:#e67700; }
  #log { margin-top:12px; max-width:860px; background:#111318; border-radius:8px; padding:10px 12px;
         font-family:ui-monospace,Consolas,monospace; font-size:11.5px; line-height:1.65;
         max-height:300px; overflow:auto; white-space:pre-wrap; }
  .ok{color:#69db7c}.bad{color:#ff8787}.warn{color:#ffd43b}.dim{opacity:.5}.hi{color:#74c0fc}
</style>
</head>
<body>
<h1>🔬 解码环境 vs 直播源 对照测试</h1>
<div class="sub">先用标准测试流验证这台机器能不能正常播 HLS；再对比 CCTV 源。逐个切换，一次只播一路。</div>

<div class="tabs" id="tabs"></div>
<div id="wrap">
  <video id="v" playsinline webkit-playsinline muted></video>
  <div id="verdict">待测试</div>
</div>
<div id="log"></div>

<script src="js/vendor/hls-1.7.3.min.js"></script>
<script>
(function () {
  var logEl = document.getElementById('log');
  var v = document.getElementById('v');
  var verdict = document.getElementById('verdict');
  var hls = null, timer = 0;

  function log(m, c) {
    var d = document.createElement('div');
    if (c) d.className = c;
    d.textContent = new Date().toISOString().slice(11, 19) + '  ' + m;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }
  function setVerdict(t, c) { verdict.textContent = t; verdict.className = c || ''; }

  var SOURCES = [
    {
      id: 'apple',
      label: '① Apple 官方测试流（H.264 标准）',
      url: 'https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_fmp4/master.m3u8',
      note: '苹果官方示例，任何浏览器都必须能播'
    },
    {
      id: 'mux',
      label: '② Mux 测试流（H.264 标准）',
      url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8',
      note: '业界常用 HLS 测试流'
    },
    {
      id: 'cctv10',
      label: '③ CCTV-10（问题源）',
      url: 'https://ldocctvwbcdbyte.volcfcdn.com/ldocctvwbcd/cdrmldcctv10_1/index.m3u8?b=200-4000',
      note: '当前出绿色乱码的源'
    },
    {
      id: 'cctv6',
      label: '④ CCTV-6（问题源）',
      url: 'https://ldocctvwbcdbyte.volcfcdn.com/ldocctvwbcd/cdrmldcctv6_1/index.m3u8?b=200-4000',
      note: '换一个频道对比'
    }
  ];

  var tabs = document.getElementById('tabs');
  SOURCES.forEach(function (s) {
    var b = document.createElement('button');
    b.textContent = s.label;
    b.dataset.id = s.id;
    b.onclick = function () { run(s, b); };
    tabs.appendChild(b);
  });

  function teardown() {
    clearInterval(timer);
    if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
    try { v.pause(); } catch (e) {}
    v.removeAttribute('src');
    try { v.load(); } catch (e) {}
    logEl.innerHTML = '';
  }

  /* 抓帧判色 */
  function judge(label) {
    if (!v.videoWidth) { setVerdict('无画面数据', 'bad'); return null; }
    try {
      var c = document.createElement('canvas');
      c.width = 160; c.height = Math.round(160 * v.videoHeight / v.videoWidth) || 90;
      var g = c.getContext('2d');
      g.drawImage(v, 0, 0, c.width, c.height);
      var d = g.getImageData(0, 0, c.width, c.height).data;
      var green = 0, black = 0, other = 0, n = d.length / 4;
      for (var i = 0; i < d.length; i += 4) {
        var r = d[i], gg = d[i+1], b = d[i+2];
        if (r < 25 && gg < 25 && b < 25) black++;
        else if (gg > r + 30 && gg > b + 30) green++;
        else other++;
      }
      var gp = green/n*100, bp = black/n*100;
      var txt = '绿 ' + gp.toFixed(1) + '% / 黑 ' + bp.toFixed(1) + '% / 其他 ' + (other/n*100).toFixed(1) + '%';
      log(label + ' 抓帧 → ' + txt, gp > 50 ? 'bad' : bp > 90 ? 'warn' : 'ok');
      if (gp > 50) { setVerdict('❌ 绿色乱码', 'bad'); return 'green'; }
      if (bp > 90) { setVerdict('⚠ 黑屏', 'warn'); return 'black'; }
      setVerdict('✅ 画面正常', 'ok');
      return 'ok';
    } catch (e) {
      log(label + ' 抓帧受限（跨域污染）: ' + e.message, 'dim');
      setVerdict('播放中（无法抓帧）', 'warn');
      return 'unknown';
    }
  }

  function run(src, btn) {
    document.querySelectorAll('.tabs button').forEach(function (b) { b.classList.remove('on'); });
    btn.classList.add('on');
    teardown();
    log('=== ' + src.label + ' ===', 'hi');
    log(src.url, 'dim');
    log(src.note, 'dim');
    setVerdict('连接中…');

    hls = new Hls({ lowLatencyMode: false, enableWorker: false });
    hls.on(Hls.Events.MANIFEST_PARSED, function (e, d) {
      log('清单解析 OK，' + d.levels.length + ' 个清晰度', 'ok');
      d.levels.forEach(function (l, i) {
        log('  L' + i + ' ' + l.width + 'x' + l.height + ' ' + (l.videoCodec || '?'), 'dim');
      });
      v.play().catch(function () {});
    });
    hls.on(Hls.Events.ERROR, function (e, d) {
      log('ERR ' + d.type + '/' + d.details + ' fatal=' + d.fatal +
          (d.error ? ' | ' + d.error.message : ''), d.fatal ? 'bad' : 'warn');
    });

    hls.loadSource(src.url);
    hls.attachMedia(v);
    v.play().catch(function () {});

    var n = 0;
    timer = setInterval(function () {
      n++;
      log('  ' + (n * 2) + 's  rs=' + v.readyState + ' ' + v.videoWidth + 'x' + v.videoHeight +
          ' t=' + v.currentTime.toFixed(1), 'dim');
      if (n === 3 || n === 6) judge(src.id);
      if (n >= 8) clearInterval(timer);
    }, 2000);
  }

  log('UA: ' + navigator.userAgent, 'dim');
  log('MSE H264 High: ' + MediaSource.isTypeSupported('video/mp4;codecs="avc1.64001e"'), 'dim');
  log('提示：请逐个点上面的按钮，每次只播一路，避免多路抢占解码器。', 'warn');
})();
</script>
</body>
</html>
